<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: grid;
      place-items: center;
    }

    .card {
      width: 900px;
      height: 900px;
      border-radius: 210px;
      background: #ffffff;
      display: grid;
      place-items: center;
    }

    .card img {
      width: 780px;
      height: 780px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="../../assets/logo/safeprint_logo.svg" alt="SafePrint logo">
  </div>
</body>
</html>
